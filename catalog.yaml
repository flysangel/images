families:
  alpine:
    distro: alpine
    values:
      BASE: "3.21.3"
      SEAWEEDFS_URL: https://github.com/seaweedfs/seaweedfs/releases/download/4.36/linux_amd64.tar.gz
      SEAWEEDFS_SHA256: ef49adec172b528c7a79c3c5e61fcf39da16d9b192908d6d4efda365592addef
    aliases:
      PROVISION_REF_IN: PROVISION_REF
    services:
      base:     { class: A, version: "3.21.3" }
      sshd:     { class: B, version_from: { package: openssh-server } }
      podman:   { class: B, version_from: { package: podman } }
      qemu:     { class: B, version_from: { package: qemu-system-x86_64 } }
      s3cli:    { class: A, version: "4.36" }
      k8stools: { class: C }
      k8sadm:   { class: C }
      runner:   { class: B, version_from: { command: "task --version" } }
  ubuntu:
    distro: ubuntu
    values:
      BASE: "24.04"
    aliases:
      PROVISION_REF_IN: PROVISION_REF
    services:
      base:  { class: A, version: "24.04" }
      sshd:  { class: B, version_from: { package: openssh-server } }
      knife: { class: B, version_from: { command: "kubectl version --client" } }
  fbs:
    distro: alpine
    services:
      base: { class: B, version_from: { command: "filebrowser version" } }
  open-webui:
    distro: alpine
    services:
      dbadm: { class: C }
  gmm:
    # 三顆的基底不同（guacd 是 alpine，guacamole 的 tomcat 與 mariadb 是 ubuntu），distro 填多數的 ubuntu。
    # gmm 的乙類只用 command 探測，不用 package，所以 distro 不影響探測。
    distro: ubuntu
    values:
      GUACAMOLE_VERSION: "1.6.0"
    services:
      guacd:     { class: A, version: "1.6.0" }
      guacamole: { class: A, version: "1.6.0" }
      mariadb:   { class: B, version_from: { command: "mariadbd --version" } }
  rdp:
    # 兩條桌面鏈：<de> → <de>-podman → <de>-k8stools → <de>-k8sadm，<de> 是 lxqt、xfce4。桌面層疊在 ubuntu:sshd 上。
    # 全部丙類，延續 registry 上既有的 <service>-vX.Y.Z tag。
    distro: ubuntu
    aliases:
      PROVISION_REF_IN: PROVISION_REF
    services:
      lxqt:           { class: C }
      xfce4:          { class: C }
      lxqt-podman:    { class: C }
      xfce4-podman:   { class: C }
      lxqt-k8stools:  { class: C }
      xfce4-k8stools: { class: C }
      lxqt-k8sadm:    { class: C }
      xfce4-k8sadm:   { class: C }
  bigdata:
    # hadoop 系譜：jdk 疊在 ubuntu:sshd 上，組件疊在 jdk 或 hadoop 上；hiveDB 疊在上游 mariadb 上。
    # 甲類的 version 是組件的上游版本，與 values 裡同組件的 *_VERSION、*_URL 同一個版本，升版要一起改。
    # *_VERSION 的值是解壓後的目錄名，Dockerfile 拿它組 /opt/<目錄名> 與 /conf/<目錄名>，不是單純的版本號。
    # 丙類延續 registry 上既有的 <service>-vX.Y.Z tag。
    distro: ubuntu
    values:
      JAVA_VERSION: jdk8u492-b09
      JAVA_URL: https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
