# 5-svc chain fixture for img.sh tests
# CHAIN 攤平成一維,共 5 個 svc,測 FD 3 chain iteration regression
#
# 宣告順序刻意既非字母序也非字母逆序(s3 s5 s1 s4 s2):真 repo 的 CHAIN 是拓撲序
# (例 alpine 的 "base sshd podman qemu s3cli k8stools k8sadm runner"),字母序會拆掉
# FROM 依賴。舊 fixture 寫 "s1 s2 s3 s4 s5",字母序恰等於宣告序,
# family_services_in_chain() 若被加上 | sort 讓拓撲序退化成字母序,測試照樣全綠。
# 順序斷言請用 check_log_sequence(自 conf 推導期望序),不要用首尾兩點比對。
SERVICE_VERSION=v0.0.1
CHAIN="s3 s5 s1 s4 s2"
