# taroko-shaped fixture (matrix) for img.sh tests
# 2 nodes + 2 cri-docker servers + 1 docker server = 5 entries
# 不宣告 UPSTREAM,template 內也不引用 upstream 變數
#
# 三軸的值刻意互不重疊(v1.x / v2.x / v3.x):三軸若共用同一組值,
# build_taroko／ci_taroko／family_image_refs 把某一軸的餵料鍵接錯
# (例 node 迴圈改讀 SERVERS_CRI_DOCKER)產出的 tag 集合完全相同,
# 斷言全過、突變存活。值分軸後接線錯誤才會顯示成 tag 不對。
NODES="v1.1.1 v1.1.2"
SERVERS_CRI_DOCKER="v2.2.1 v2.2.2"
SERVERS_DOCKER=v3.3.3
