# gmm (Guacamole) family 版本宣告
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
SERVICE_VERSION=v1.0.7
# 產出順序（原 chain 的 [guacd, guacamole] 與 [mariadb] 兩組攤平成一維）
# 三顆彼此無 FROM 依賴，此序只是產出順序，不是 build 依賴序
CHAIN="guacd guacamole mariadb"
# 上游 family：guacamole 的 downloader stage 取 alpine:base-<ALPINE_SERVICE_VERSION>
UPSTREAM=alpine
# Guacamole 上游版本（原 extras.guacamole_version）
# 三處消費：guacamole 原始碼 tarball 的 git tag、guacd 的 FROM tag、mariadb initdb stage 的 FROM tag
# 注意無 v 前綴，與 SERVICE_VERSION 的 vX.Y.Z 格式不同
GUACAMOLE_VERSION=1.6.0
