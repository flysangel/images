# taroko family 版本宣告(matrix 結構;沒有單一 SERVICE_VERSION 概念,故無 SERVICE_VERSION / CHAIN 鍵)
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# img.sh build taroko 走獨立分支,迭代 NODES / SERVERS_CRI_DOCKER / SERVERS_DOCKER
UPSTREAM=alpine

# K8s node images(基於 kindest/node)
# tag = <REGISTRY_PREFIX>/taroko:<NODES 單格>
# 單格值經 --build-arg KUBERNETES_VERSION 進 node.Dockerfile
NODES="v1.31.0 v1.31.1 v1.31.2 v1.31.4 v1.31.6 v1.31.9 v1.31.12 v1.32.0 v1.32.1 v1.32.2 v1.32.3 v1.32.5 v1.32.8 v1.33.0 v1.33.1 v1.33.2 v1.33.4 v1.34.0"

# K8s server images(基於 jrei/systemd-ubuntu + cri-dockerd)
# tag = <REGISTRY_PREFIX>/taroko:cri-docker-<SERVERS_CRI_DOCKER 單格>
# 單格值經 --build-arg KEY_VERSION 進 server.Dockerfile
SERVERS_CRI_DOCKER="v1.31 v1.32 v1.33 v1.34"
# tag = <REGISTRY_PREFIX>/taroko:docker-<SERVERS_DOCKER 單格>
# 此鍵只決定 tag,不進 --build-arg(docker.Dockerfile 沒有對應 ARG)
SERVERS_DOCKER=v1.0.3

# 第三方工具做版本釘選（pin）(node / server 用;官方 release 源 + sha256 校驗,取代 build 期 releases/latest 浮動查詢)
# 以下各鍵鍵名即 Dockerfile 的光桿 ARG 名,由 img.sh 以 --build-arg 同名傳入
# cni-plugins（containernetworking/plugins；GitHub release 附 .sha256)— node.Dockerfile downloader stage
CNI_PLUGINS_URL=https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz
CNI_PLUGINS_SHA256=b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303
# helm（helm/helm；get.helm.sh 官方源附 .sha256sum)— node.Dockerfile 第二個 stage
HELM_URL=https://get.helm.sh/helm-v4.2.2-linux-amd64.tar.gz
HELM_SHA256=9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6
# cri-dockerd（Mirantis/cri-dockerd；ubuntu-jammy_amd64.deb,沿用原樣板選的 jammy 資產)— server.Dockerfile
# 上游 release 無 checksums 檔;此 sha256 為本地下載 v0.4.3 deb 計算後做版本釘選（pin）(一次性,可重現)
CRI_DOCKERD_URL=https://github.com/Mirantis/cri-dockerd/releases/download/v0.4.3/cri-dockerd_0.4.3.3-0.ubuntu-jammy_amd64.deb
CRI_DOCKERD_SHA256=1a46ef750d772adb54917c6dd4f00d74d29957a0294452cc9c4d22e2ef5b7c6d
