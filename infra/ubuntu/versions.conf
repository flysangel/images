# ubuntu family 版本宣告
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# BASE 是上游映像 library/ubuntu 的 tag，只有 base.Dockerfile 的 FROM 取用
# 原 versions.yaml 寫 base: "24.04" 加引號是為了擋 YAML 把它解成浮點數；conf 的值不含空白就不加引號，直接寫字面值
BASE=24.04
# SERVICE_VERSION 是本 family 的 tag 後綴，同時被 bigdata／rdp 以 UBUNTU_SERVICE_VERSION 取用，鍵名不可改
SERVICE_VERSION=v1.0.4
# CHAIN 攤平成一維空白分隔，順序即 build 順序：base → sshd → knife
CHAIN="base sshd knife"
