# bigdata family 版本宣告（hadoop 系譜單機鏈；套件一律官方源 + checksum）
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# SERVICE_VERSION = family 版本；組件的 dir/url/checksum 展平成頂層鍵，由 img.sh 以 --build-arg 餵給樣板的光桿 ARG
SERVICE_VERSION=v1.0.1
# CHAIN 攤平成一維空白分隔，順序即 build 依賴序（重排會讓下游拉不到上游映像）
CHAIN="jdk zookeeper kafka hadoop hbase hive spark hadoop-ha hive-ha hbase-ha hiveDB dtc-ha"
# 僅 jdk 走上游：FROM ubuntu:sshd-${UBUNTU_SERVICE_VERSION}，值由 img.sh 讀 infra/ubuntu/versions.conf 加前綴衍生
UPSTREAM=ubuntu
# OpenJDK（Eclipse Temurin；Adoptium 官方 release、glibc linux x64）
# 注意：jdk 樣板的 ARG 名是 JAVA_VERSION，值取自本檔的 JAVA_DIR（改名發生在 img.sh 值表層，不在 Dockerfile）
JAVA_DIR=jdk8u492-b09
JAVA_URL=https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u492-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u492b09.tar.gz
JAVA_SHA256=da257f161d7f8c6ca5b0e5d9e4090f65ac28c5e398072e68b8ae87988b1d1a2e
# Apache 組件 —— archive.apache.org 官方永久源
# 以下每個 *_DIR 同樣在 img.sh 值表層衍生成同值的 *_VERSION 才進 --build-arg
ZOOKEEPER_DIR=apache-zookeeper-3.8.4-bin
ZOOKEEPER_URL=https://archive.apache.org/dist/zookeeper/zookeeper-3.8.4/apache-zookeeper-3.8.4-bin.tar.gz
ZOOKEEPER_SHA512=4d85d6f7644d5f36d9c4d65e78bd662ab35ebe1380d762c24c12b98af029027eee453437c9245dbdf2b9beb77cd6b690b69e26f91cf9d11b0a183a979c73fa43
KAFKA_DIR=kafka_2.13-3.7.0
KAFKA_URL=https://archive.apache.org/dist/kafka/3.7.0/kafka_2.13-3.7.0.tgz
KAFKA_SHA512=b8679283a2d8dab86e7c636b2c688fe9d9e64ac437241f65ef7a1733f4d26a2bd415eefa04f09f1911373bcd2a5dbc3838c76347f68656425c09202cd290ce91
HADOOP_DIR=hadoop-3.4.0
HADOOP_URL=https://archive.apache.org/dist/hadoop/common/hadoop-3.4.0/hadoop-3.4.0.tar.gz
HADOOP_SHA512=6f653c0109f97430047bd3677c50da7c8a2809d153b231794cf980b3208a6b4beff8ff1a03a01094299d459a3a37a3fe16731629987165d71f328657dbf2f24c
HBASE_DIR=hbase-2.5.8-hadoop3
HBASE_URL=https://archive.apache.org/dist/hbase/2.5.8/hbase-2.5.8-hadoop3-bin.tar.gz
HBASE_SHA512=6b61b264310e9854d1cf47cb91a149a82643ad2400a96351e4a73c329e140b18bb728282d7b9855c3f25215c6357924265909f85f39a634070c0d092b678516b
HIVE_DIR=apache-hive-4.0.0-bin
HIVE_URL=https://archive.apache.org/dist/hive/hive-4.0.0/apache-hive-4.0.0-bin.tar.gz
HIVE_SHA256=83eb88549ae88d3df6a86bb3e2526c7f4a0f21acafe21452c18071cee058c666
# MariaDB JDBC（hive 與 dtc-ha 內嵌；Maven Central 官方）
