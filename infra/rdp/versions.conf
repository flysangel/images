# rdp family 版本宣告(DE × 角色:lxqt/xfce4 桌面 → +podman → +k8stools → +k8sadm)
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# 桌面層(lxqt/xfce4)獨立 FROM ubuntu:sshd 可平行;podman FROM 對應桌面;k8stools FROM 對應 podman;k8sadm FROM 對應 k8stools
SERVICE_VERSION=v1.0.2
# CHAIN 攤平成一維,順序即建置序;原 yaml 的四組分層邊界不再保留(同層可平行的資訊靠上方註解表達)
CHAIN="lxqt xfce4 lxqt-podman xfce4-podman lxqt-k8stools xfce4-k8stools lxqt-k8sadm xfce4-k8sadm"
# 上游 family:桌面層 FROM ubuntu:sshd,衍生鍵 UBUNTU_SERVICE_VERSION 由 img.sh 從 infra/ubuntu/versions.conf 取得
UPSTREAM=ubuntu
