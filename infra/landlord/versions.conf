# landlord family 版本宣告（多租戶 SSH 平台；alpine tenant 重用 k8stools；hadoop tenant FROM bigdata:dtc-ha）
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# SERVICE_VERSION = family 版本，只用於 image tag，不出現在任何 Dockerfile
SERVICE_VERSION=v1.0.3
# UPSTREAM 宣告的家族衍生出 ALPINE_SERVICE_VERSION / BIGDATA_SERVICE_VERSION，供 FROM 行取用
UPSTREAM="alpine bigdata"
# CHAIN 攤平成一維，順序即 build 順序
CHAIN="gateway logger mariadb tenant tenant-hadoop"
