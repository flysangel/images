# alpine family 版本宣告
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
# img.sh 從這裡取 BASE / SERVICE_VERSION,並依 CHAIN 排 build 順序
BASE=3.21.3
SERVICE_VERSION=v1.0.3
# chain 攤平成一維:空白分隔,順序即 build 順序(原 YAML 的分組邊界零消費,已取消)
CHAIN="base sshd podman qemu s3cli k8stools k8sadm runner"
# 第三方工具做版本釘選（pin）(s3cli 用;官方 release 源 + sha256 校驗,取代 build 期 releases/latest 浮動查詢)
# 原 extras 的鍵展平（flatten）成 UPPER_SNAKE 後直接當頂層鍵;Dockerfile 側寫光桿 ARG SEAWEEDFS_URL / ARG SEAWEEDFS_SHA256
# seaweedfs（seaweedfs/seaweedfs；GitHub release linux_amd64.tar.gz。
#   上游只發 .md5,無 sha256 檔;此 sha256 為本地下載 4.36/linux_amd64.tar.gz 計算,
#   並已對上游 .md5(df1a0f9629a5aa04890e804390ab8f8d)交叉驗過。）
SEAWEEDFS_URL=https://github.com/seaweedfs/seaweedfs/releases/download/4.36/linux_amd64.tar.gz
SEAWEEDFS_SHA256=ef49adec172b528c7a79c3c5e61fcf39da16d9b192908d6d4efda365592addef
