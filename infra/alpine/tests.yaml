# alpine family 的煙霧測試規格，由 `imgctl test` 讀取。
# defaults 套給每個 service；service 有寫的欄位蓋過 defaults，寫 null 表示關掉。
# ssh、wait_port 為 null 的 service 沒有 sshd，改用 docker exec 驗。
defaults: { privileged: true, ssh: { user: bigred, password: bigred }, wait_port: 22 }
services:
  base:     { ssh: null, wait_port: null, commands: [sudo, bash, sshpass, jq, yq, nano, tree, curl, wget, git, grep, setfacl, dialog, 7z, inotifywait, nc, shellcheck], timezone: Asia/Taipei }
  sshd:     {}
  podman:   { commands: [podman, skopeo, buildah] }
  qemu:     { commands: [qemu-system-x86_64, qemu-img] }
  s3cli:    { commands: [mc, weed] }
  k8stools: { commands: [kind, kubectl, helm, kustomize, hadolint] }
  k8sadm:   { commands: [kind, kubectl, helm, kustomize, hadolint], files: [{ path: /home/bigred/.kube/config.tmp, mode: "600", owner: bigred }] }
  runner:   { ssh: null, wait_port: null, privileged: false, commands: [git, task, jq, nslookup, curl] }
