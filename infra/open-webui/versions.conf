# open-webui family 版本宣告
# 文法：一行一個 KEY=VALUE，# 開頭的行是註解。img.sh 會 source 本檔：含空白的值加雙引號，值不得含 $ 或反引號，task lint:family 擋
SERVICE_VERSION=v1.0.1
CHAIN=dbadm
# 上游 alpine：img.sh 由此衍生 ALPINE_SERVICE_VERSION 與 ALPINE_BASE 兩個鍵
# 本 family 的 FROM 直接拉 library/alpine 映像，用的是 ALPINE_BASE（= infra/alpine/versions.conf 的 BASE），不是 ALPINE_SERVICE_VERSION
UPSTREAM=alpine
