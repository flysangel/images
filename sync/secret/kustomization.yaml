# skopeo 同步憑證的 Secret 宣告。本目錄自成一個 kustomize root,
# 由 sync/kustomization.yaml 以 resources: [secret] 目錄型引用。
# 真值檔 secret.env 不進版控（.gitignore 的 *.env）;範本見同目錄 secret.env.example。
# name 必須逐字是 skopeo-registry-creds——sync/deploy/cronjob.yaml 的 envFrom.secretRef 依此名引用。
# disableNameSuffixHash:關掉內容雜湊後綴,產物名恆為字面值,cronjob.yaml 才不必跟著改。
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: skopeo-registry-creds
    envs:
      - secret.env
