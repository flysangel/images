# 可重用 workflow：建一批 service（同批互不相依，matrix 並行）。
# 前面各批的 ref-* artifact 下載到 parents/，imgctl build 靠它找上層映像。
name: build-batch

on:
  workflow_call:
    inputs:
      services:
        description: '這批要建的 service，JSON 陣列，元素為 <family>:<service>'
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: podman 登入 GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: podman login ghcr.io -u "$ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: 下載前面各批的 ref 檔
        uses: actions/download-artifact@v4
        with:
          pattern: ref-*
          path: parents
          merge-multiple: true
      - name: 建置並推到 staging
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          mkdir -p parents out
          go run ./cmd/imgctl build \
            --plan plan.json \
            --service "$SERVICE" \
            --parents parents \
            --push ghcr.io/flysangel/images-staging \
            --sha "$GITHUB_SHA" \
            --out out
      - name: 算 artifact 名稱
        id: name
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "n=${SERVICE//:/_}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ref-${{ steps.name.outputs.n }}
          path: out/${{ steps.name.outputs.n }}.ref
          if-no-files-found: error
      - name: 記錄磁碟用量
        if: always()
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          {
            echo "### $SERVICE 磁碟用量"
            echo '```'
            df -h /
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
